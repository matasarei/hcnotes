memory_limit = 256M
max_execution_time = 60
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; The site only serves GET/HEAD and accepts no uploads. Keep request parsing
; minimal: multipart parsing and session upload progress are the PHP2Shell
; (CVE-2026-109618/109619) attack paths.
expose_php = Off
file_uploads = Off
max_file_uploads = 0
post_max_size = 64K
upload_max_filesize = 0
max_input_vars = 100
max_input_nesting_level = 16
session.upload_progress.enabled = Off
; Keep query strings out of $argv (Symfony Runtime APP_ENV/APP_DEBUG bypasses).
register_argc_argv = Off

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
